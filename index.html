<!DOCTYPE html>
<html lang="el">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ΑΣΟΚ — Αθλητικός Σκοπευτικός Όμιλος Καλαμάτας</title>
<script async src="https://www.googletagmanager.com/gtag/js?id=G-8QD8EGK9V4"></script>
<script>
  window.dataLayer = window.dataLayer || [];

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Source+Serif+4:ital,wght@0,300;0,400;0,600;1,300;1,400&family=Space+Grotesk:wght@300;400;500;600&display=swap" rel="stylesheet">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<style>
  *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
  html { scroll-behavior: smooth; }
  body {
    background: #111b2e;
    color: #f0ead8;
    font-family: 'Space Grotesk', sans-serif;
    min-height: 100vh;
  }
  ::-webkit-scrollbar { width: 6px; }
  ::-webkit-scrollbar-track { background: #111b2e; }
  ::-webkit-scrollbar-thumb { background: #c8a030; border-radius: 3px; }

  /* Hero background animations */
  @keyframes heroKenBurns {
    0%   { transform: scale(1.05) translate(0, 0); }
    50%  { transform: scale(1.18) translate(-1.5%, -1%); }
    100% { transform: scale(1.05) translate(0, 0); }
  }
  @keyframes heroGradientShift {
    0%   { background-position: 0% 50%; }
    50%  { background-position: 100% 50%; }
    100% { background-position: 0% 50%; }
  }
  @keyframes heroReticleSpin {
    from { transform: rotate(0deg); }
    to   { transform: rotate(360deg); }
  }
  @keyframes heroParticleFloat {
    0%   { transform: translateY(0) translateX(0); opacity: 0; }
    10%  { opacity: 0.5; }
    90%  { opacity: 0.5; }
    100% { transform: translateY(-100vh) translateX(20px); opacity: 0; }
  }
  .hero-bg-image {
    animation: heroKenBurns 28s ease-in-out infinite;
    will-change: transform;
  }
  .hero-bg-overlay {
    background: linear-gradient(105deg, rgba(17,27,46,0.92) 30%, rgba(17,27,46,0.45) 70%, rgba(212,169,58,0.08) 100%);
    background-size: 200% 200%;
    animation: heroGradientShift 18s ease-in-out infinite;
  }
  .hero-reticle-spin {
    animation: heroReticleSpin 60s linear infinite;
  }
  .hero-particle {
    position: absolute;
    width: 2px;
    height: 2px;
    background: rgba(212,169,58,0.55);
    border-radius: 50%;
    bottom: -10px;
    pointer-events: none;
    animation: heroParticleFloat linear infinite;
  }

  /* ── Mobile-toggle defaults (hidden on desktop) ── */
  .nav-mobile-toggle { display: none; }
  .nav-mobile-menu { display: none; }

  /* ── Tablet & mobile ≤ 900px ── */
  @media (max-width: 900px) {
    .nav-desktop-links { display: none !important; }
    .nav-cta-desktop { display: none !important; }
    .nav-mobile-toggle { display: flex !important; }

    .grid-2col { grid-template-columns: 1fr !important; }
    .grid-3col-photos { grid-template-columns: 1fr 1fr !important; }
    .footer-grid { grid-template-columns: 1fr !important; gap: 36px !important; }
    .ann-row { grid-template-columns: 1fr !important; gap: 14px !important; padding: 28px 24px !important; }

    .hero-stats { gap: 36px !important; flex-wrap: wrap; }
    .hero-reticle-spin { opacity: 0.35 !important; right: -25% !important; }
    .hero-padding { padding: 88px clamp(20px,6vw,40px) 56px !important; }
  }

  /* ── Mobile ≤ 640px ── */
  @media (max-width: 640px) {
    .grid-3col-photos { grid-template-columns: 1fr !important; }
    .gallery-grid { grid-template-columns: 1fr !important; }
    .gallery-grid > * { grid-column: auto !important; }
    .stats-3col { grid-template-columns: 1fr 1fr !important; }

    .hero-stats { gap: 24px !important; }
    .hero-buttons { flex-direction: column !important; align-items: stretch !important; }
    .hero-buttons > * { width: 100% !important; text-align: center; }
    .hero-padding { padding: 80px 20px 48px !important; }
    .hero-reticle-spin { display: none !important; }

    .section-padding { padding-left: 20px !important; padding-right: 20px !important; }
    .footer-bottom { flex-direction: column !important; gap: 16px !important; align-items: flex-start !important; }
    .contact-cta { flex-direction: column !important; align-items: flex-start !important; gap: 18px !important; padding: 24px 22px !important; }
  }

  /* ── Mobile menu overlay ── */
  .nav-mobile-menu.is-open {
    display: flex !important;
    position: fixed; top: 72px; left: 0; right: 0; bottom: 0; z-index: 99;
    background: rgba(17,27,46,0.98);
    backdrop-filter: blur(18px);
    flex-direction: column;
    padding: 32px 28px;
    gap: 4px;
    animation: heroGradientShift 1s ease-out;
  }
  .nav-mobile-menu.is-open .nav-mobile-link {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 26px;
    letter-spacing: 0.08em;
    color: #f4efe3;
    padding: 18px 4px;
    border-bottom: 1px solid rgba(212,169,58,0.18);
    cursor: pointer;
  }
  .nav-mobile-menu.is-open .nav-mobile-link.active { color: #d4a93a; }

  /* ── Event announcement banner ── */
  @keyframes bannerSlideDown {
    from { transform: translateY(-100%); opacity: 0; }
    to   { transform: translateY(0); opacity: 1; }
  }
  .event-banner {
    position: fixed; top: 72px; left: 0; right: 0; z-index: 95;
    animation: bannerSlideDown 0.6s cubic-bezier(0.22,1,0.36,1) both;
    background: linear-gradient(90deg, #1a2742 0%, #233354 50%, #1a2742 100%);
    border-bottom: 1px solid rgba(212,169,58,0.45);
    box-shadow: 0 8px 24px rgba(0,0,0,0.32);
  }
  .event-banner-inner {
    display: flex; align-items: center; gap: 18px;
    padding: 11px clamp(20px, 5vw, 72px);
    max-width: 1400px; margin: 0 auto;
  }
  .event-banner-cta {
    font-family: 'Space Grotesk', sans-serif;
    font-size: 11px; font-weight: 600; letter-spacing: 0.12em; text-transform: uppercase;
    padding: 8px 18px; border: 1px solid #d4a93a; color: #d4a93a;
    cursor: pointer; white-space: nowrap; transition: all 0.2s; background: transparent;
  }
  .event-banner-cta:hover { background: #d4a93a; color: #111b2e; }
  .event-banner-close {
    background: transparent; border: none; color: rgba(244,239,227,0.55);
    font-size: 22px; line-height: 1; cursor: pointer; padding: 4px 6px; transition: color 0.2s;
  }
  .event-banner-close:hover { color: #d4a93a; }
  @media (max-width: 720px) {
    .event-banner-inner { gap: 12px; padding: 10px 18px; }
    .event-banner-text-sub { display: none; }
    .event-banner-cta { padding: 7px 12px; font-size: 10px; }
  }
</style>
</head>
<body>
<div id="root"></div>

<script type="text/babel">
const { useState, useEffect } = React;

// ── Colors ────────────────────────────────────────────────────────
const C = {
  bg:       "#111b2e",
  bg2:      "#172035",
  bg3:      "#1e2d45",
  gold:     "#d4a93a",
  goldDim:  "rgba(212,169,58,0.18)",
  white:    "#f4efe3",
  mid:      "rgba(244,239,227,0.72)",
  dim:      "rgba(244,239,227,0.42)",
  border:   "rgba(212,169,58,0.18)",
};

// ── Photos ────────────────────────────────────────────────────────
const PHOTOS = {
  team:     "uploads/660382128_1458442075977790_4267698106050903520_n.jpg",
  podium:   "uploads/658150805_1458442105977787_994430311091057490_n.jpg",
  facility: "uploads/475674248_1130037335484934_5739089800326555547_n.jpg",
  poster1:  "uploads/656416811_1453504383138226_301068151431856087_n.jpg",
  poster2:  "uploads/hero-bg-logo.jpg",
  logo:     "uploads/pasted-1777711422017-0.png",
};

// ── Lightbox ──────────────────────────────────────────────────────
function Lightbox({ src, label, onClose }) {
  useEffect(() => {
    const onKey = e => { if (e.key === "Escape") onClose(); };
    window.addEventListener("keydown", onKey);
    document.body.style.overflow = "hidden";
    return () => {
      window.removeEventListener("keydown", onKey);
      document.body.style.overflow = "";
    };
  }, [onClose]);
  return (
    <div onClick={onClose} style={{
      position: "fixed", inset: 0, zIndex: 999,
      background: "rgba(8,12,22,0.96)",
      display: "flex", flexDirection: "column",
      alignItems: "center", justifyContent: "center",
      cursor: "zoom-out",
    }}>
      <button onClick={onClose} style={{
        position: "fixed", top: 24, right: 28,
        background: "transparent", border: "1px solid rgba(212,169,58,0.4)",
        color: "#d4a93a", fontFamily: "'Bebas Neue'", fontSize: 18,
        letterSpacing: "0.1em", padding: "7px 18px", cursor: "pointer", zIndex: 1000,
      }}>ΚΛΕΙΣΙΜΟ ✕</button>
      <img src={src} alt={label} onClick={e => e.stopPropagation()} style={{
        maxWidth: "90vw", maxHeight: "85vh", objectFit: "contain", display: "block",
        boxShadow: "0 24px 80px rgba(0,0,0,0.7)", cursor: "default",
      }} />
      {label && (
        <div style={{ marginTop: 16, fontSize: 11, letterSpacing: "0.18em", textTransform: "uppercase", color: "rgba(212,169,58,0.8)", fontFamily: "'Space Grotesk'" }}>{label}</div>
      )}
    </div>
  );
}

// ── Clickable Photo ───────────────────────────────────────────────
function Photo({ src, pos = "center center", label, height, style = {}, openLightbox }) {
  const [hovered, setHovered] = React.useState(false);
  return (
    <div style={{ height, overflow: "hidden", position: "relative", cursor: "zoom-in", flexShrink: 0, ...style }}
      onClick={() => openLightbox(src, label)}
      onMouseEnter={() => setHovered(true)}
      onMouseLeave={() => setHovered(false)}>
      <img src={src} alt={label} style={{
        width: "100%", height: "100%", objectFit: "cover",
        objectPosition: pos, display: "block",
        transition: "transform 0.5s",
        transform: hovered ? "scale(1.04)" : "scale(1)",
      }} />
      <div style={{
        position: "absolute", bottom: 0, left: 0, right: 0,
        padding: "40px 20px 14px",
        background: "linear-gradient(transparent, rgba(17,27,46,0.78))",
      }}>
        <div style={{ fontSize: 10, letterSpacing: "0.16em", textTransform: "uppercase", color: "rgba(244,239,227,0.7)" }}>{label}</div>
      </div>
      <div style={{
        position: "absolute", top: 12, right: 12,
        background: "rgba(17,27,46,0.75)", border: "1px solid rgba(212,169,58,0.35)",
        borderRadius: 2, padding: "4px 8px",
        fontSize: 9, letterSpacing: "0.12em", color: "rgba(212,169,58,0.8)",
        opacity: hovered ? 1 : 0, transition: "opacity 0.2s",
      }}>⊕ ZOOM</div>
    </div>
  );
}

// ── Reticle ───────────────────────────────────────────────────────
function Reticle({ size = 400, opacity = 0.07, style = {} }) {
  const r = size / 2;
  return (
    <svg width={size} height={size} viewBox={`0 0 ${size} ${size}`}
      fill="none" stroke={C.gold} strokeWidth="1"
      style={{ position: "absolute", pointerEvents: "none", opacity, ...style }}>
      <circle cx={r} cy={r} r={r * 0.92} />
      <circle cx={r} cy={r} r={r * 0.66} />
      <circle cx={r} cy={r} r={r * 0.4} />
      <circle cx={r} cy={r} r={r * 0.13} />
      <line x1={r} y1={0}    x2={r}    y2={r * 0.85} />
      <line x1={r} y1={r * 1.15} x2={r} y2={size} />
      <line x1={0}    y1={r} x2={r * 0.85} y2={r} />
      <line x1={r * 1.15} y1={r} x2={size} y2={r} />
    </svg>
  );
}

// ── Nav ───────────────────────────────────────────────────────────
function Nav({ page, setPage }) {
  const [scrolled, setScrolled] = useState(false);
  const [menuOpen, setMenuOpen] = useState(false);

  useEffect(() => {
    const onScroll = () => setScrolled(window.scrollY > 40);
    window.addEventListener("scroll", onScroll);
    return () => window.removeEventListener("scroll", onScroll);
  }, []);

  const links = [
    ["home","ΑΡΧΙΚΗ"],["about","ΣΥΛΛΟΓΟΣ"],["gallery","GALLERY"],
    ["results","ΑΠΟΤΕΛΕΣΜΑΤΑ"],["announcements","ΑΝΑΚΟΙΝΩΣΕΙΣ"],["training","ΠΡΟΓΡΑΜΜΑ"],["weather","ΚΑΙΡΟΣ"]
  ];

  return (
    <nav style={{
      position: "fixed", top: 0, left: 0, right: 0, zIndex: 100,
      height: 72,
      background: scrolled ? "rgba(17,27,46,0.97)" : "rgba(17,27,46,0.85)",
      borderBottom: `1px solid ${scrolled ? C.border : "transparent"}`,
      backdropFilter: "blur(12px)",
      display: "flex", alignItems: "center",
      justifyContent: "space-between",
      padding: "0 clamp(20px, 5vw, 72px)",
      transition: "all 0.3s",
    }}>
      {/* Logo */}
      <div style={{ display: "flex", alignItems: "center", gap: 12, cursor: "pointer" }}
           onClick={() => setPage("home")}>
        <img src={PHOTOS.logo} alt="ΑΣΟΚ"
          style={{ width: 44, height: 44, borderRadius: "50%", objectFit: "cover", border: `1.5px solid ${C.gold}` }} />
        <div>
          <div style={{ fontFamily: "'Bebas Neue'", fontSize: 19, letterSpacing: "0.16em", color: C.gold, lineHeight: 1 }}>ΑΣΟΚ</div>
          <div style={{ fontSize: 8, letterSpacing: "0.14em", textTransform: "uppercase", color: C.dim, lineHeight: 1.2 }}>Καλαμάτα · 1959</div>
        </div>
      </div>

      {/* Desktop links */}
      <div className="nav-desktop-links" style={{ display: "flex", gap: 32, fontSize: 11, fontWeight: 500, letterSpacing: "0.1em", textTransform: "uppercase" }}>
        {links.map(([k, l]) => (
          <span key={k} onClick={() => setPage(k)} style={{
            cursor: "pointer",
            color: page === k ? C.gold : C.mid,
            borderBottom: page === k ? `1px solid ${C.gold}` : "1px solid transparent",
            paddingBottom: 2,
            transition: "color 0.2s",
          }}>{l}</span>
        ))}
      </div>

      {/* CTA (desktop only) */}
      <div className="nav-cta-desktop" onClick={() => setPage("announcements")} style={{
        fontSize: 11, fontWeight: 600, letterSpacing: "0.14em", textTransform: "uppercase",
        padding: "9px 22px", border: `1px solid ${C.gold}`, color: C.gold,
        cursor: "pointer", transition: "all 0.2s",
      }}
        onMouseEnter={e => { e.currentTarget.style.background = C.gold; e.currentTarget.style.color = C.bg; }}
        onMouseLeave={e => { e.currentTarget.style.background = "transparent"; e.currentTarget.style.color = C.gold; }}>
        ΑΝΑΚΟΙΝΩΣΕΙΣ →
      </div>

      {/* Mobile hamburger toggle */}
      <div className="nav-mobile-toggle" onClick={() => setMenuOpen(!menuOpen)} style={{
        width: 44, height: 44, alignItems: "center", justifyContent: "center",
        cursor: "pointer", border: `1px solid ${C.gold}`, color: C.gold,
      }}>
        <div style={{ display: "flex", flexDirection: "column", gap: 5, alignItems: "center", justifyContent: "center" }}>
          <span style={{ display: "block", width: 18, height: 1.5, background: C.gold, transition: "transform 0.2s", transform: menuOpen ? "translateY(6.5px) rotate(45deg)" : "none" }} />
          <span style={{ display: "block", width: 18, height: 1.5, background: C.gold, opacity: menuOpen ? 0 : 1, transition: "opacity 0.2s" }} />
          <span style={{ display: "block", width: 18, height: 1.5, background: C.gold, transition: "transform 0.2s", transform: menuOpen ? "translateY(-6.5px) rotate(-45deg)" : "none" }} />
        </div>
      </div>

      {/* Mobile fullscreen menu */}
      <div className={`nav-mobile-menu ${menuOpen ? "is-open" : ""}`}>
        {links.map(([k, l]) => (
          <span key={k}
            className={`nav-mobile-link ${page === k ? "active" : ""}`}
            onClick={() => { setPage(k); setMenuOpen(false); }}>
            {l}
          </span>
        ))}
        <div style={{ marginTop: 24, fontFamily: "'Space Grotesk'", fontSize: 13, color: "rgba(244,239,227,0.5)" }}>
          📞 697 216 9048
        </div>
      </div>
    </nav>
  );
}

// ── EVENT BANNER (αρχική) ─────────────────────────────────────────
function EventBanner({ setPage }) {
  const announcement = getActiveBannerAnnouncement();
  const [dismissed, setDismissed] = useState(false);
  if (!announcement || dismissed) return null;

  const now = new Date();
  const event = new Date(announcement.eventDate + "T00:00:00");
  const daysLeft = Math.max(0, Math.ceil((event - now) / (1000 * 60 * 60 * 24)));
  const countdown = daysLeft === 0 ? "Σήμερα!" : daysLeft === 1 ? "Αύριο" : `σε ${daysLeft} ημέρες`;

  return (
    <div className="event-banner">
      <div className="event-banner-inner">
        <span style={{
          fontFamily: "'Space Grotesk'", fontSize: 10, fontWeight: 600,
          letterSpacing: "0.14em", textTransform: "uppercase",
          color: "#111b2e", background: C.gold, padding: "4px 10px", whiteSpace: "nowrap",
        }}>{countdown}</span>
        <div style={{ flex: 1, minWidth: 0 }}>
          <span style={{
            fontFamily: "'Space Grotesk'", fontSize: 14, fontWeight: 500, color: C.gold,
          }}>{announcement.title}</span>
          <span className="event-banner-text-sub" style={{
            fontFamily: "'Source Serif 4', serif", fontStyle: "italic",
            fontSize: 13, color: C.mid, marginLeft: 12,
          }}>· {announcement.date} · Σκοπευτήριο Καλαμάτας</span>
        </div>
        <button className="event-banner-cta" onClick={() => setPage("announcements")}>
          Δείτε περισσότερα →
        </button>
        <button className="event-banner-close" aria-label="Κλείσιμο" onClick={() => setDismissed(true)}>×</button>
      </div>
    </div>
  );
}

// ── POSTER SLIDESHOW (αρχική, πάνω πάνω) ─────────────────────────
// Δείχνει τις αφίσες των επερχόμενων αγώνων (ανακοινώσεις με poster +
// eventDate που δεν έχει περάσει). Φεύγει αυτόματα μετά το συμβάν.
function PosterSlideshow({ setPage, openLightbox }) {
  const now = new Date();
  const posters = ANNOUNCEMENTS.filter(a =>
    a.poster && a.eventDate && new Date(a.eventDate + "T23:59:59") >= now
  );
  const [idx, setIdx] = useState(0);

  useEffect(() => {
    if (posters.length < 2) return;
    const t = setInterval(() => setIdx(i => (i + 1) % posters.length), 6000);
    return () => clearInterval(t);
  }, [posters.length]);

  if (!posters.length) return null;
  const a = posters[idx % posters.length];

  return (
    <section style={{
      position: "relative", background: C.bg2,
      padding: "150px clamp(24px,6vw,96px) 56px",
      borderBottom: `1px solid ${C.border}`, overflow: "hidden",
    }}>
      <Reticle size={420} opacity={0.05} style={{ left: -120, bottom: -140 }} />
      <div style={{ maxWidth: 1100, margin: "0 auto", position: "relative" }}>
        <div style={{ textAlign: "center", marginBottom: 28 }}>
          <div style={{ fontSize: 11, fontWeight: 600, letterSpacing: "0.24em", color: C.gold, textTransform: "uppercase", marginBottom: 12 }}>
            Επόμενος Αγώνας
          </div>
          <h2 style={{ fontFamily: "'Bebas Neue'", fontSize: "clamp(28px,4vw,48px)", lineHeight: 1.05 }}>
            {a.title}
          </h2>
          <div style={{ fontFamily: "'Source Serif 4', serif", fontStyle: "italic", fontSize: 15, color: C.mid, marginTop: 8 }}>
            {a.date} · Σκοπευτήριο Καλαμάτας
          </div>
        </div>

        <div style={{ position: "relative", display: "flex", justifyContent: "center", alignItems: "center" }}>
          {posters.length > 1 && (
            <button onClick={() => setIdx(i => (i - 1 + posters.length) % posters.length)} aria-label="Προηγούμενο" style={{
              position: "absolute", left: 0, zIndex: 2,
              background: "rgba(17,27,46,0.75)", border: `1px solid ${C.gold}`, color: C.gold,
              fontSize: 22, width: 44, height: 44, cursor: "pointer",
            }}>‹</button>
          )}
          <img
            src={a.poster}
            alt={a.title}
            onClick={() => openLightbox ? openLightbox(a.poster, a.title) : setPage("announcements")}
            style={{
              maxWidth: "100%", maxHeight: "72vh", display: "block",
              border: `1px solid ${C.border}`, cursor: "zoom-in",
              boxShadow: "0 24px 64px rgba(0,0,0,0.45)",
            }}
          />
          {posters.length > 1 && (
            <button onClick={() => setIdx(i => (i + 1) % posters.length)} aria-label="Επόμενο" style={{
              position: "absolute", right: 0, zIndex: 2,
              background: "rgba(17,27,46,0.75)", border: `1px solid ${C.gold}`, color: C.gold,
              fontSize: 22, width: 44, height: 44, cursor: "pointer",
            }}>›</button>
          )}
        </div>

        {posters.length > 1 && (
          <div style={{ display: "flex", justifyContent: "center", gap: 10, marginTop: 20 }}>
            {posters.map((_, i) => (

// Επιστρέφει την επόμενη ανακοίνωση-συμβάν που δεν έχει περάσει ακόμα (ή null).
function getActiveBannerAnnouncement() {
  const now = new Date();
  const upcoming = ANNOUNCEMENTS
    .filter(a => a.eventDate)
    .map(a => ({ a, end: new Date(a.eventDate + "T23:59:59") }))
    .filter(x => x.end >= now)
    .sort((x, y) => x.end - y.end);
  return upcoming.length ? upcoming[0].a : null;
}

// ── WEATHER PAGE ─────────────────────────────────────────────────
function WeatherPage() {
  const [wx, setWx] = useState(null);
  const [loading, setLoading] = useState(true);
  const [selDay, setSelDay] = useState(0);

  useEffect(() => {
    fetch("https://api.open-meteo.com/v1/forecast?latitude=37.0353&longitude=22.1114&current=temperature_2m,apparent_temperature,weather_code,wind_speed_10m,wind_direction_10m,relative_humidity_2m&hourly=temperature_2m,precipitation_probability,weather_code,wind_speed_10m&daily=weather_code,temperature_2m_max,temperature_2m_min,precipitation_probability_max,wind_speed_10m_max,sunrise,sunset,uv_index_max&timezone=Europe%2FAthens&forecast_days=7")
      .then(r => r.json())
      .then(d => { setWx(d); setLoading(false); })
      .catch(() => setLoading(false));
  }, []);

  const WMO = {
    0:"Αίθριος",1:"Κυρίως αίθριος",2:"Μερ. συννεφιά",3:"Συννεφιά",
    45:"Ομίχλη",48:"Ομίχλη",51:"Ψιλόβροχο",53:"Ψιλόβροχο",55:"Ψιλόβροχο",
    61:"Βροχή",63:"Βροχή",65:"Έντονη βροχή",71:"Χιόνι",73:"Χιόνι",75:"Χιόνι",
    80:"Ντους",81:"Ντους",82:"Ισχυρός ντους",95:"Καταιγίδα",96:"Καταιγίδα",99:"Καταιγίδα",
  };
  const ICON = {
    0:"☀",1:"🌤",2:"⛅",3:"☁",45:"🌫",48:"🌫",
    51:"🌦",53:"🌦",55:"🌦",61:"🌧",63:"🌧",65:"🌧",
    71:"🌨",73:"🌨",75:"❄",80:"🌦",81:"🌦",82:"⛈",95:"⛈",96:"⛈",99:"⛈",
  };
  const DAYS = ["Κυρ","Δευ","Τρί","Τετ","Πέμ","Παρ","Σάβ"];
  const MONTHS = ["Ιαν","Φεβ","Μαρ","Απρ","Μαΐ","Ιουν","Ιουλ","Αυγ","Σεπ","Οκτ","Νοε","Δεκ"];

  // Hourly slices for the selected forecast day
  const hourlyForSel = () => {
    if (!wx || !wx.hourly) return [];
    const dayStr = wx.daily.time[selDay];
    const out = [];
    wx.hourly.time.forEach((t,idx)=>{
      if (t.slice(0,10) === dayStr && [6,9,12,15,18,21].includes(Number(t.slice(11,13)))) {
        out.push({
          h: t.slice(11,16),
          temp: Math.round(wx.hourly.temperature_2m[idx]),
          code: wx.hourly.weather_code[idx],
          pop: wx.hourly.precipitation_probability[idx],
          wind: Math.round(wx.hourly.wind_speed_10m[idx]),
        });
      }
    });
    return out;
  };

  return (
    <div style={{ paddingTop: 72, minHeight: "100vh", background: C.bg }}>
      {/* Header */}
      <div style={{ position:"relative", background: C.bg2, padding:"80px clamp(24px,6vw,96px) 64px", overflow:"hidden" }}>
        <Reticle size={360} opacity={0.06} style={{ right:0, top:-40 }} />
        <div style={{ fontSize:11, fontWeight:600, letterSpacing:"0.22em", color:C.gold, marginBottom:16, textTransform:"uppercase" }}>Καλαμάτα · Μεσσηνία</div>
        <h1 style={{ fontFamily:"'Bebas Neue'", fontSize:"clamp(52px,7vw,88px)", lineHeight:0.92 }}>
          ΠΡΟ<span style={{ color:C.gold }}>ΓΝΩΣΗ</span> ΚΑΙΡΟΥ
        </h1>
      </div>

      <div style={{ padding:"48px clamp(24px,6vw,96px)" }}>
        {loading && <p style={{ color:C.mid, fontFamily:"'Space Grotesk'" }}>Φόρτωση δεδομένων...</p>}

        {wx && (
          <>
            {/* Current weather card */}
            <div style={{ display:"flex", gap:32, flexWrap:"wrap", marginBottom:48 }}>
              <div style={{ flex:"1 1 320px", background:C.bg2, border:`1px solid ${C.border}`, padding:36 }}>
                <div style={{ fontSize:11, fontWeight:600, letterSpacing:"0.2em", textTransform:"uppercase", color:C.gold, marginBottom:20 }}>Τωρινός Καιρός · Καλαμάτα</div>
                <div style={{ display:"flex", alignItems:"center", gap:20, marginBottom:24 }}>
                  <span style={{ fontSize:72, lineHeight:1 }}>{ICON[wx.current.weather_code]||"☀"}</span>
                  <div>
                    <div style={{ fontFamily:"'Bebas Neue'", fontSize:80, lineHeight:1, color:C.light }}>{Math.round(wx.current.temperature_2m)}°</div>
                    <div style={{ fontFamily:"'Space Grotesk'", fontSize:14, color:C.mid, marginTop:4 }}>{WMO[wx.current.weather_code]||"—"}</div>
                  </div>
                </div>
                <div style={{ display:"grid", gridTemplateColumns:"1fr 1fr", gap:"10px 24px", fontFamily:"'Space Grotesk'", fontSize:13 }}>
                  {[
                    ["Αίσθηση", Math.round(wx.current.apparent_temperature)+"°"],
                    ["Υγρασία", wx.current.relative_humidity_2m+"%"],
                    ["Άνεμος", Math.round(wx.current.wind_speed_10m)+" km/h"],
                    ["Κατεύθυνση", wx.current.wind_direction_10m+"°"],
                  ].map(([k,v])=>(
                    <div key={k}>
                      <div style={{ color:C.dim, fontSize:11, letterSpacing:"0.1em", textTransform:"uppercase", marginBottom:2 }}>{k}</div>
                      <div style={{ color:C.light, fontWeight:500 }}>{v}</div>
                    </div>
                  ))}
                </div>
              </div>

              {/* 7-day forecast (clickable) */}
              <div style={{ flex:"2 1 400px", display:"flex", flexDirection:"column", gap:3 }}>
                {wx.daily.time.map((t,i)=>{
                  const d = new Date(t+"T12:00:00");
                  const label = i===0?"Σήμερα":i===1?"Αύριο":DAYS[d.getDay()]+" "+d.getDate()+" "+MONTHS[d.getMonth()];
                  const active = selDay===i;
                  return (
                    <div key={t} onClick={()=>setSelDay(i)} style={{
                      display:"flex", alignItems:"center", gap:16, cursor:"pointer",
                      background: active ? "rgba(212,169,58,0.12)" : C.bg2,
                      border:`1px solid ${active ? C.gold : C.border}`, padding:"14px 20px",
                      transition:"all 0.15s",
                    }}>
                      <span style={{ fontSize:28, minWidth:36 }}>{ICON[wx.daily.weather_code[i]]||"☀"}</span>
                      <div style={{ fontFamily:"'Space Grotesk'", fontSize:13, color: active ? C.gold : C.mid, flex:1, minWidth:100, fontWeight: active?600:400 }}>{label}</div>
                      <div style={{ fontFamily:"'Space Grotesk'", fontSize:13, color:"#6aabff", minWidth:40 }}>💧{wx.daily.precipitation_probability_max[i]}%</div>
                      <div style={{ fontFamily:"'Bebas Neue'", fontSize:20, color:C.light, minWidth:60, textAlign:"right" }}>
                        {Math.round(wx.daily.temperature_2m_max[i])}° <span style={{ color:C.dim, fontSize:16 }}>{Math.round(wx.daily.temperature_2m_min[i])}°</span>
                      </div>
                    </div>
                  );
                })}
              </div>
            </div>

            {/* Selected-day detail panel */}
            <div style={{ background:C.bg2, border:`1px solid ${C.border}`, padding:"28px 32px", marginBottom:48 }}>
              <div style={{ fontSize:11, fontWeight:600, letterSpacing:"0.2em", textTransform:"uppercase", color:C.gold, marginBottom:18 }}>
                Αναλυτικά · {(()=>{const d=new Date(wx.daily.time[selDay]+"T12:00:00"); return selDay===0?"Σήμερα":selDay===1?"Αύριο":DAYS[d.getDay()]+" "+d.getDate()+" "+MONTHS[d.getMonth()];})()}
              </div>
              <div style={{ display:"grid", gridTemplateColumns:"repeat(auto-fit,minmax(110px,1fr))", gap:"14px 24px", fontFamily:"'Space Grotesk'", fontSize:13, marginBottom:24 }}>
                {[
                  ["Μέγιστη", Math.round(wx.daily.temperature_2m_max[selDay])+"°"],
                  ["Ελάχιστη", Math.round(wx.daily.temperature_2m_min[selDay])+"°"],
                  ["Βροχή", wx.daily.precipitation_probability_max[selDay]+"%"],
                  ["Άνεμος", Math.round(wx.daily.wind_speed_10m_max[selDay])+" km/h"],
                  ["UV δείκτης", Math.round(wx.daily.uv_index_max[selDay])],
                  ["Ανατολή", (wx.daily.sunrise[selDay]||"").slice(11,16)],
                  ["Δύση", (wx.daily.sunset[selDay]||"").slice(11,16)],
                ].map(([k,v])=>(
                  <div key={k}>
                    <div style={{ color:C.dim, fontSize:11, letterSpacing:"0.08em", textTransform:"uppercase", marginBottom:3 }}>{k}</div>
                    <div style={{ color:C.light, fontWeight:500, fontSize:15 }}>{v}</div>
                  </div>
                ))}
              </div>
              {/* Hourly strip */}
              <div style={{ display:"flex", gap:10, overflowX:"auto", paddingBottom:4 }}>
                {hourlyForSel().map((h,k)=>(
                  <div key={k} style={{ minWidth:78, textAlign:"center", background:C.bg, border:`1px solid ${C.border}`, padding:"12px 8px" }}>
                    <div style={{ fontFamily:"'Space Grotesk'", fontSize:12, color:C.mid, marginBottom:6 }}>{h.h}</div>
                    <div style={{ fontSize:24, marginBottom:4 }}>{ICON[h.code]||"☀"}</div>
                    <div style={{ fontFamily:"'Bebas Neue'", fontSize:22, color:C.light }}>{h.temp}°</div>
                    <div style={{ fontFamily:"'Space Grotesk'", fontSize:11, color:"#6aabff", marginTop:4 }}>💧{h.pop}%</div>
                    <div style={{ fontFamily:"'Space Grotesk'", fontSize:11, color:C.dim, marginTop:2 }}>{h.wind} km/h</div>
                  </div>
                ))}
              </div>
            </div>
          </>
        )}
      </div>
    </div>
  );
}

  const [page, setPage] = useState("home");
  const [lightbox, setLightbox] = useState(null);
  const openLightbox = (src, label) => setLightbox({ src, label });
  const closeLightbox = () => setLightbox(null);

  useEffect(() => {
    window.scrollTo({ top: 0, behavior: "smooth" });
  }, [page]);

  const pages = {
    home:       <HomePage setPage={setPage} openLightbox={openLightbox} />,
    about:      <AboutPage openLightbox={openLightbox} />,
    gallery:    <GalleryPage openLightbox={openLightbox} />,
    results:    <ResultsPage openLightbox={openLightbox} />,
    announcements: <AnnouncementsPage openLightbox={openLightbox} />,
    training:   <TrainingPage />,
    weather:    <WeatherPage />,
  };

  return (
    <div style={{ minHeight: "100vh" }}>
      <Nav page={page} setPage={setPage} />
      {pages[page]}
      {lightbox && <Lightbox src={lightbox.src} label={lightbox.label} onClose={closeLightbox} />}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
